/* --- M1: Natural Language Inquiry Parser & Completer --- */
function parseInquiry(text, formOverride = {}, targetCategory = null) {
  let cat = targetCategory;
  if (!cat) {
    if (/微波|不锈钢|304|steel/i.test(text)) cat = 'microwave-sus304';
    else if (/冰袋|保冷|冷凝|chill/i.test(text)) cat = 'chill-icepack-bento';
    else if (/零食|八格|snackle/i.test(text)) cat = 'viral-snackle';
    else if (/沙拉|大碗|salad/i.test(text)) cat = 'salad-bento-bowl';
    else if (/双层|手提|stackable/i.test(text)) cat = 'stackable-2tier';
    else if (/小麦|秸秆|eco|straw/i.test(text)) cat = 'eco-wheatstraw';
    else if (/保温包|餐包|bag|cooler/i.test(text)) cat = 'insulated-bag';
    else cat = 'kids-5-bento';
  }

  const categoryObj = NAIKE_CATEGORIES.find(c => c.id === cat) || NAIKE_CATEGORIES[0];

  // Qty detection
  let qty = 3000;
  const qm = text.match(/(\d+)\s*(?:套|个|件|pcs|PCS)/i);
  if (qm) qty = parseInt(qm[1], 10);
  else if (/1\s*万|一万/.test(text)) qty = 10000;

  // Customization detection
  const hasLogo = /logo|印|丝印|激光|打标|热转印/i.test(text);
  const logoType = /激光/i.test(text) ? '激光打标' : /热转印/i.test(text) ? '热转印' : '丝网印刷 (单色)';
  const colorMatch = text.match(/Pantone\s*([0-9A-Za-z]+)|薄荷绿|粉色|藏蓝|灰色|蓝色|黄色/i);
  const colorSpec = colorMatch ? colorMatch[0] : '标准耐科蓝绿 (Pantone 320C)';

  // Build values
  const values = {
    categoryId: categoryObj.id,
    name: categoryObj.name,
    nameEn: categoryObj.nameEn,
    sku: categoryObj.sku,
    qty: formOverride.qty !== undefined ? formOverride.qty : qty,
    length: formOverride.length !== undefined ? formOverride.length : categoryObj.dims.l,
    width: formOverride.width !== undefined ? formOverride.width : categoryObj.dims.w,
    height: formOverride.height !== undefined ? formOverride.height : categoryObj.dims.h,
    volMl: formOverride.volMl !== undefined ? formOverride.volMl : categoryObj.volMl,
    compartments: formOverride.compartments !== undefined ? formOverride.compartments : categoryObj.compartments,
    material: formOverride.material !== undefined ? formOverride.material : categoryObj.stdMaterial,
    sealType: formOverride.sealType !== undefined ? formOverride.sealType : categoryObj.sealType,
    customColor: formOverride.customColor !== undefined ? formOverride.customColor : colorSpec,
    logoProcess: formOverride.logoProcess !== undefined ? formOverride.logoProcess : (hasLogo ? logoType : '激光刻印/无印刷'),
    foodCert: formOverride.foodCert !== undefined ? formOverride.foodCert : 'US FDA 21 CFR 177.1520 & LFGB §30/31',
    port: 'FOB 厦门港 (XMN, China)',
    carton: categoryObj.carton,
    img: categoryObj.img
  };

  // Structured Parameter tracking
  const params = [
    { label: '基准品类', value: values.name, unit: '—', source: 'customer', note: `型号 SKU: ${values.sku}` },
    { label: '采购数量', value: values.qty, unit: '套', source: qm ? 'customer' : 'default', note: '起订量 MOQ 1,000 套起' },
    { label: '产品外形尺寸', value: `${values.length} × ${values.width} × ${values.height}`, unit: 'mm', source: 'ai', note: '精密注塑钢模尺寸' },
    { label: '额定容量', value: values.volMl, unit: 'ml', source: 'ai', note: '多格独立控量容积' },
    { label: '分格数量', value: `${values.compartments} 格`, unit: '格', source: 'ai', note: '独立干湿隔离分仓' },
    { label: '主材规格', value: values.material, unit: '—', source: 'default', note: '100% 食品级 BPA Free' },
    { label: '密封技术', value: values.sealType, unit: '—', source: 'ai', note: '耐科液态铂金硅胶气密专利' },
    { label: '定制外观色标', value: values.customColor, unit: '—', source: colorMatch ? 'customer' : 'default', note: '支持 Pantone 潘通色卡对色' },
    { label: 'Logo 定制工艺', value: values.logoProcess, unit: '—', source: hasLogo ? 'customer' : 'default', note: '外贸高耐磨不掉字标准' },
    { label: '食品合规标准', value: values.foodCert, unit: '—', source: 'default', note: 'SGS / Intertek 第三方出海认证' },
    { label: '交货港口', value: values.port, unit: '—', source: 'default', note: '晋江工厂距厦门港仅 60km (1h集港)' }
  ];

  const issues = [];
  if (values.qty < categoryObj.moq) {
    issues.push(`提示：当前定制数量 ${values.qty} 套低于工厂标准起订量 ${categoryObj.moq} 套，建议增加批量以平摊模具换型与开机费。`);
  }
  if (!colorMatch) {
    issues.push(`未指定 Pantone 色号，已默认推荐耐科经典标准色，大货支持客户指定 Pantone 对色。`);
  }

  return { values, params, issues, categoryObj };
}

/* --- M3: BOM & ERP Material Calculation --- */
function calculateBom(values) {
  const isSteel = /304|stainless/i.test(values.categoryId);
  const isWheat = /wheat/i.test(values.categoryId);
  const isBag = /bag/i.test(values.categoryId);

  const rows = [];
  let seq = 10;

  // 1. Main outer body resin
  if (!isBag) {
    const resinKey = isWheat ? 'wheat_straw_compound' : 'pp_resin';
    const resinItem = RAW_MATERIALS[resinKey];
    const resinWeightKg = 0.28; // 280g resin per box
    rows.push({
      seq: seq++,
      partNo: `NK-MAT-${seq}`,
      category: 'resin',
      name: resinItem.name,
      spec: resinItem.spec,
      qty: resinWeightKg,
      unit: 'kg',
      unitPrice: resinItem.price,
      amount: resinWeightKg * resinItem.price,
      stock: resinItem.stock,
      source: '常备原料库'
    });
  }

  // 2. Stainless Steel Tray (If applicable)
  if (isSteel) {
    const ss = RAW_MATERIALS.sus304_plate;
    const ssWeightKg = 0.22; // 220g 304 per unit
    rows.push({
      seq: seq++,
      partNo: `NK-MAT-${seq}`,
      category: 'steel',
      name: ss.name,
      spec: ss.spec,
      qty: ssWeightKg,
      unit: 'kg',
      unitPrice: ss.price,
      amount: ssWeightKg * ss.price,
      stock: ss.stock,
      source: '大宗钢卷库存'
    });
  }

  // 3. Silicone Gasket
  if (!isBag) {
    const sil = RAW_MATERIALS.lsr_silicone;
    const silKg = 0.045; // 45g platinum silicone
    rows.push({
      seq: seq++,
      partNo: `NK-MAT-${seq}`,
      category: 'silicone',
      name: sil.name,
      spec: sil.spec,
      qty: silKg,
      unit: 'kg',
      unitPrice: sil.price,
      amount: silKg * sil.price,
      stock: sil.stock,
      source: '食品级铂金胶'
    });
  }

  // 4. TPE Drop-proof Corners
  if (!isBag && !isWheat) {
    const tpe = RAW_MATERIALS.tpe_resin;
    const tpeKg = 0.035; // 35g
    rows.push({
      seq: seq++,
      partNo: `NK-MAT-${seq}`,
      category: 'tpe',
      name: tpe.name,
      spec: tpe.spec,
      qty: tpeKg,
      unit: 'kg',
      unitPrice: tpe.price,
      amount: tpeKg * tpe.price,
      stock: tpe.stock,

  // 8. Outer Master Carton (Amortized per unit)
  const ctn = RAW_MATERIALS.export_carton;

  return {

/* --- M4: Process Routing & Labor Hours --- */
function calculateProcess(values, overrides = {}) {
  const steps = PROCESS_ROUTES.map((route, i) => {
    const ov = overrides[route.code] || {};
    const setupMin = ov.setupMin !== undefined ? ov.setupMin : route.setupMin;
    const cycleSec = ov.cycleSec !== undefined ? ov.cycleSec : route.cycleSec;
    const workMinPerPiece = cycleSec / 60;
    const rateHr = route.machineRateHr;
    const costPerPiece = (workMinPerPiece / 60) * rateHr;

    return {
      seq: (i + 1) * 10,
      code: route.code,
      name: route.name,
      desc: route.desc,
      keyNode: route.keyNode,
      setupMin,
      cycleSec,
      workMinPerPiece,
      machineRateHr: rateHr,
      costPerPiece
    };
  });

  const totalCycleSec = steps.reduce((sum, s) => sum + s.cycleSec, 0);
  const totalSetupMin = steps.reduce((sum, s) => sum + s.setupMin, 0);
  const totalLaborCost = steps.reduce((sum, s) => sum + s.costPerPiece, 0);

  return {
    steps,
    summary: {
      totalCycleSec,
      totalSetupMin,
      totalLaborCost,
      cycleMin: totalCycleSec / 60
    },
    calibrated: Object.keys(overrides).length > 0
  };
}

/* --- M5: Dynamic Costing & Tiered Quotations --- */
function calculateCostAndTiers(bom, proc, values, opts = {}) {
  const profitRate = (opts.profitRate || state.profitRate) / 100;
  const co = state.costOverrides || {};

  // Direct costs
  const matCost = co.matCost !== undefined ? co.matCost : bom.totals.materialCost;
  const laborCost = co.laborCost !== undefined ? co.laborCost : proc.summary.totalLaborCost;

  // Overhead & Packaging/Haulage
  const overheadRate = 0.10; // 10% 工厂管理与能耗折旧
  const freightPortRate = 0.04; // 4% 厦门集港与出口报关运杂费

  const overheadCost = co.overheadCost !== undefined ? co.overheadCost : (matCost + laborCost) * overheadRate;
  const freightPortCost = co.freightCost !== undefined ? co.freightCost : matCost * freightPortRate;

  const totalCostBase = matCost + laborCost + overheadCost + freightPortCost;

  // Tiered Quantities (1,000 / 3,000 / 5,000 / 10,000)
  const tiers = [1000, 3000, 5000, 10000];
  const tierRows = tiers.map((qty, idx) => {
    // Volume discount on setup time and material purchasing power
    const setupAmortMin = proc.summary.totalSetupMin / qty;
    const setupAmortCost = (setupAmortMin / 60) * 110;

    const matDisc = idx === 0 ? 0 : Math.min(0.08, idx * 0.025);
    const profitMarginAdj = idx === 0 ? 0 : Math.min(0.05, idx * 0.015);
    const effProfit = Math.max(0.12, profitRate - profitMarginAdj);

    const unitMatCost = matCost * (1 - matDisc);
    const unitLabor = laborCost + setupAmortCost;
    const unitTotalCost = unitMatCost + unitLabor + overheadCost + freightPortCost;

    const unitPriceCny = unitTotalCost / (1 - effProfit);
    const unitPriceUsd = unitPriceCny / state.usdRate;
    const extendedUsd = unitPriceUsd * qty;
    const extendedCny = unitPriceCny * qty;

    return {
      qty,
      unitMatCost,
      unitLabor,
      unitTotalCost,
      unitPriceCny,
      unitPriceUsd,
      extendedUsd,
      extendedCny,
      profitPct: Math.round(effProfit * 100),
      leadDays: idx === 0 ? 20 : 20 + idx * 2
    };
  });

  return {
    breakdown: {
      matCost,
      laborCost,
      overheadCost,
      freightPortCost,
      totalCostBase
    },
    tierRows,
    currency: 'USD',
    exchangeRate: state.usdRate
  };
}

/* --- Run Full Scheme Calculation --- */
function executeScheme() {
  const m1 = parseInquiry(state.text, state.form, state.categoryId);
  state.values = m1.values;
  state.params = m1.params;
  state.issues = m1.issues;

  const svg = generateSvgBlueprint(state.values);
  const bom = calculateBom(state.values);
  const process = calculateProcess(state.values, state.processOverrides);
  const cost = calculateCostAndTiers(bom, process, state.values, { profitRate: state.profitRate });
  const responsePkg = buildResponsePackage({ values: state.values, cost });

  state.scheme = {
    values: state.values,
    params: state.params,
    issues: state.issues,
    svg,
    bom,
    process,
    cost,
    responsePkg,
    quoteNo: responsePkg.quoteNo
  };

  state.dirty = false;
}

function modStatus(n) {
  if (n === 1) return '';
  if (!state.scheme) return '<span class="mod-flag empty" title="未计算">○</span>';
  if (state.dirty) return '<span class="mod-flag stale" title="参数已变更，待重新计算">↻</span>';
  return '<span class="mod-flag done" title="已计算">✓</span>';
}

function renderMods() {
  $('mods').innerHTML = MODULES.map(m => `
    <div class="step-item ${m.n === state.tab ? 'active' : ''}" data-step="${m.n}">
      <div class="step-num">${m.n}</div>
      <div class="step-txt"><b>${m.t}</b><span>${m.s}</span></div>
      ${modStatus(m.n)}
    </div>
  `).join('');

  document.querySelectorAll('.step-item').forEach(el => {
    el.addEventListener('click', () => setTab(Number(el.dataset.step)));
  });
}

function renderTopbar() {
  const m = MODULES[state.tab - 1];
  $('stepTitle').textContent = `${m.n}. ${m.t}`;
  $('stepSubtitle').textContent = m.s;
  $('topbarActions').innerHTML = state.scheme
    ? `<span class="badge badge-info" style="font-size:12px; padding:4px 10px;"><i class="fa-solid fa-file-invoice-dollar"></i> 报价单号 ${esc(state.scheme.quoteNo)}</span>`
    : '';
}

function setTab(n) {
  state.tab = n;
  renderMods();
  renderTopbar();
  renderTabContent();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function markDirty() {
  if (state.scheme && !state.dirty) {
    state.dirty = true;
    renderMods();
    renderTabContent();
  }
}

function renderTabContent() {
  const content = $('content');
  $('staleBanner').innerHTML = (state.dirty && state.tab >= 2 && state.scheme)
    ? `<div class="alert alert-warn stale-banner">
         <span><i class="fa-solid fa-arrows-rotate"></i> 参数或成本已发生修改，当前展示为旧方案。</span>
         <button class="btn btn-primary btn-sm" id="btnRecalcNow">立即重新计算全案</button>
       </div>`
    : '';

    $('btnRecalcNow').addEventListener('click', () => {
      executeScheme();
      toast('全案已按新参数重新核算完成！');
      renderMods();
